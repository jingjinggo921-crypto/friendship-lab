<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷史填答紀錄｜Friendship Lab</title><style>body{margin:0;background:#fafafa;color:#242424;font:16px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{box-sizing:border-box;max-width:720px;margin:28px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 2px 20px #0001}h1{font-size:24px;margin:0 0 8px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#d33667;text-decoration:none}small,.sub{color:#6b6b6b}#toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{border:1px solid #ddd;border-radius:9px;padding:8px 12px;background:#fff;font-size:14px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #c15}.entry{border-top:1px solid #eee;padding:15px 0}.date{font-size:12px;color:#888}.answer{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}#empty{color:#777;padding:24px;text-align:center}@media(max-width:600px){main{margin:0;border-radius:0;min-height:100dvh;padding:16px}}</style></head><body><main><header><h1>📚 歷史填答紀錄</h1><a href="./index.html">返回首頁 ↗</a></header><p class="sub">可依題目查看歷次作答、修改時間，並備份或匯入紀錄。</p><small>資料只保存在這台裝置的此瀏覽器，其他同學不會看到。無須 Supabase。</small><div id="toolbar"><select id="filter" aria-label="選擇題目"><option value="">全部題目</option></select><button id="export" type="button">下載 JSON 備份</button><button id="import" type="button">匯入 JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="results" aria-live="polite"></div></main><script>
(()=>{'use strict';const key='friendship-lab-history-v1',answerKey='social-circle-v4';const labels={apps:'平常最常用什麼 App（前三名）',birthday:'生日祝福',conflictChoice:'友情衝突：行為選擇',rank:'友情衝突：嚴重程度排序',threadReply:'Threads 討論回覆',storyMessage:'限動訊息'};let data=[];const $=s=>document.querySelector(s);const norm=e=>({key:String(e.key||'其他題目'),value:e.value,time:e.time||e.at||'',source:e.source||''});try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))data=v.filter(x=>x&&typeof x==='object').map(norm)}catch(_){}if(!data.length){try{const v=JSON.parse(localStorage.getItem(answerKey)||'{}');for(const [k,val] of Object.entries(v))data.push({key:k,value:val,time:'',source:'已儲存答案'})}catch(_){}}const format=v=>{if(typeof v==='string')return v;try{return JSON.stringify(v,null,2)}catch(_){return String(v)}};function render(){const sel=$('#filter'),old=sel.value;sel.replaceChildren();let all=document.createElement('option');all.value='';all.textContent='全部題目';sel.appendChild(all);for(const k of [...new Set(data.map(x=>x.key))]){let el=document.createElement('option');el.value=k;el.textContent=labels[k]||k;sel.appendChild(el)}sel.value=old;const list=$('#results');list.replaceChildren();const filtered=data.filter(x=>!sel.value||x.key===sel.value).slice().reverse();if(!filtered.length){let p=document.createElement('p');p.id='empty';p.textContent='這個瀏覽器目前沒有歷史填答紀錄。請先返回首頁作答。';list.appendChild(p);return}for(const e of filtered){const div=document.createElement('article');div.className='entry';const name=document.createElement('strong');name.textContent=labels[e.key]||e.key;const when=document.createElement('div');when.className='date';when.textContent=e.time?new Date(e.time).toLocaleString('zh-TW'):'較早保存的填答（時間未知）';const ans=document.createElement('div');ans.className='answer';ans.textContent=format(e.value);div.append(name,when,ans);list.appendChild(div)}}$('#filter').onchange=render;$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='friendship-lab-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{let incoming=JSON.parse(await f.text());if(!Array.isArray(incoming))throw Error('檔案內容不是紀錄陣列');for(let e of incoming){if(e&&typeof e.key==='string')data.push(norm(e))}data=data.slice(-2500);localStorage.setItem(key,JSON.stringify(data));render();alert('已匯入歷史紀錄')}catch(err){alert('匯入失敗：'+err.message)}ev.target.value=''};render()})();
</script></body></html>
