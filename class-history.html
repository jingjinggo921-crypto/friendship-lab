<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全班歷史填答｜Friendship Lab</title><style>body{margin:0;background:#faf8fa;color:#25202a;font:15px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{box-sizing:border-box;max-width:760px;margin:16px auto;padding:22px;background:white;border:1px solid #eee;border-radius:18px}h1{margin:0;font-size:23px}a{color:#854699;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;gap:12px}#status{padding:12px;background:#f7f3f8;border-radius:10px;color:#5b5261}select,button{font:inherit;border:1px solid #ddd;background:white;padding:9px;border-radius:9px}.row{border-bottom:1px solid #eee;padding:14px 2px}.row p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:12px;color:#666}label{font-weight:600}small{color:#777}@media(max-width:600px){main{margin:0;border:0;border-radius:0;min-height:100dvh;padding:18px}}</style></head><body><main><header><h1>📚 全班歷史填答</h1><a href="./index.html">返回首頁</a></header><p>所有裝置共用的公開回答，依題目分類，並顯示填答時間。</p><p><small>請勿在答案中寫下真實姓名、電話、住址或其他個人資料。公開的回答，知道網址的人都可能看到。</small></p><label for="topic">題目分類　</label><select id="topic"><option value="">全部題目</option><option value="apps">最常使用的 App</option><option value="birthday">生日祝福</option><option value="conflictChoice">友情衝突：行為選擇</option><option value="rank">友情衝突：排序</option><option value="threadReply">Threads 回覆</option><option value="storyMessage">限動訊息</option><option value="care">關心朋友</option></select> <button id="refresh" type="button">重新整理</button><p id="status" role="status">準備讀取紀錄…</p><div id="results"></div></main><script src="./sheet-config.js"></script><script src="./sheet-client.js"></script><script>
(()=>{const $=s=>document.querySelector(s);async function load(){const root=$('#results');root.replaceChildren();if(!window.FriendshipSheet?.ready){$('#status').textContent='尚未連接共同儲存空間。管理員需先設定 Google 試算表 Web App 網址。';return}$('#status').textContent='正在讀取全班歷史填答…';try{const rows=await FriendshipSheet.read($('#topic').value);$('#status').textContent='目前顯示 '+rows.length+' 筆歷史紀錄（最近最多 300 筆）';if(!rows.length)$('#status').textContent='這個題目目前沒有公開回答';for(const r of rows){const el=document.createElement('article');el.className='row';const label=document.createElement('strong');label.textContent=FriendshipSheet.names[r.key]||r.key;const date=document.createElement('div');date.className='date';date.textContent=r.time?new Date(r.time).toLocaleString('zh-TW'):'時間未提供';const ans=document.createElement('p');ans.textContent=r.answer;el.append(label,date,ans);root.appendChild(el)}}catch(e){$('#status').textContent='讀取失敗：'+e.message}}$('#topic').onchange=load;$('#refresh').onclick=load;load()})();
</script></body></html>
