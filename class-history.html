<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全班歷史回覆｜Friendship Lab</title><style>body{font:16px/1.65 system-ui,-apple-system,sans-serif;color:#222;background:#faf8fa;margin:0}main{max-width:680px;background:#fff;min-height:100vh;margin:auto;padding:20px;box-sizing:border-box}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}a{color:#9c3980}select,button{padding:10px;border:1px solid #ccc;border-radius:8px;background:white;font-size:16px}.entry{padding:13px 0;border-bottom:1px solid #eee}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}.date{color:#777;font-size:12px}#status{color:#625767;margin:12px 0}</style></head><body><main><header><h1>💬 全班歷史回覆</h1><a href="./index.html">返回網站</a></header><p>這裡會顯示同學<b>主動公開送出</b>的答案。請勿輸入真實姓名、電話或私人資訊。</p><label for="question">選擇題目：</label> <select id="question"><option value="">全部題目</option><option value="apps">最常使用的 App</option><option value="birthday">生日祝福</option><option value="conflictChoice">友情衝突選擇</option><option value="rank">友情衝突排序</option><option value="threadReply">Threads 回覆</option><option value="storyMessage">限動訊息</option></select> <button id="refresh">重新整理</button><p id="status"></p><section id="results"></section></main><script src="./cloud-config.js"></script><script src="./cloud-client.js"></script><script>
(()=>{const s=document.querySelector('#status'),results=document.querySelector('#results');async function load(){results.replaceChildren();if(!window.FriendshipCloud?.ready){s.textContent='雲端資料庫尚未啟用：等待管理員完成設定。';return}s.textContent='讀取中…';try{const rows=await FriendshipCloud.list(document.querySelector('#question').value);s.textContent='顯示最近 '+rows.length+' 筆公開回覆';if(!rows.length)s.textContent='目前還沒有人公開送出答案。';for(const r of rows){const el=document.createElement('article');el.className='entry';const name=document.createElement('strong');name.textContent=FriendshipCloud.questionNames[r.question_key]||r.question_key;const time=document.createElement('div');time.className='date';time.textContent=new Date(r.created_at).toLocaleString('zh-TW');const answer=document.createElement('p');answer.textContent=r.answer_text;el.append(name,time,answer);results.appendChild(el)}}catch(e){s.textContent='讀取失敗：'+e.message}}document.querySelector('#question').onchange=load;document.querySelector('#refresh').onclick=load;load()})();
</script></body></html>
