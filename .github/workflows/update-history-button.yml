name: Update history button in website
on:
  push:
    paths:
      - 'scripts/patch_index.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch existing index.html (without changing images/layout)
        run: python scripts/patch_index.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect copy answers button to shared history page"
          git push
